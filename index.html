<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Power Rate Tracker</title>
    <link rel="icon" href="favicon.svg" sizes="32x32">
    <link rel="stylesheet" href="styles/globird-tracker.css">
</head>
<body>

    <div class="container">
        <!-- Plan Toggle -->
        <div class="plan-toggle" role="group" aria-label="Select rate plan">
            <button type="button" class="plan-toggle-btn" data-plan="globird" aria-pressed="true">GloBird ZeroHero</button>
            <button type="button" class="plan-toggle-btn" data-plan="powershop" aria-pressed="false">Powershop EV Day</button>
        </div>

        <!-- Top Status Dashboard -->
        <div class="card dashboard-card">
            <h1 id="pageTitle">Rate Status</h1>

            <div class="rate-container">
                <div id="usageBox" class="rate-box">
                    <div class="label">Usage Rate (You Pay)</div>
                    <div id="usageRate" class="value">-</div>
                </div>
                <div id="exportBox" class="rate-box">
                    <div class="label">Solar Export (FiT)</div>
                    <div id="exportRate" class="value">-</div>
                </div>
            </div>
            <div class="daily-charge" id="dailyCharge">Daily Charge: -</div>
        </div>

        <!-- Schedule Table -->
        <div class="card table-card">
            <div class="table-wrapper">
                <table id="scheduleTable">
                    <thead>
                        <tr>
                            <th>Time Period</th>
                            <th>Rate Window</th>
                            <th>Usage</th>
                            <th>Export</th>
                        </tr>
                    </thead>
                    <tbody id="scheduleBody">
                        <!-- Rows injected by JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- 24-Hour Rate Chart -->
        <div class="card chart-card">
            <div class="chart-wrapper">
                <svg id="rateChart" viewBox="0 0 640 340" role="img" aria-label="Line chart of usage and export rates across the 24-hour cycle, midnight to midnight, with the current time marked"></svg>
            </div>
            <div class="chart-legend">
                <div class="chart-legend-item"><span class="chart-legend-swatch chart-legend-swatch--usage"></span>Usage Rate (You Pay)</div>
                <div class="chart-legend-item"><span class="chart-legend-swatch chart-legend-swatch--fit"></span>Solar Export (FiT)</div>
                <div class="chart-legend-item"><span class="chart-legend-swatch chart-legend-swatch--now"></span>Current time</div>
            </div>
        </div>

        <div id="noteBox" class="note-box">
            Loading window strategies...
        </div>
    </div>

    <script src="scripts/globird-tracker.js"></script>
</body>
</html>
